version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Los tipos de Node deben coincidir con la versión del CI (.nvmrc = 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
